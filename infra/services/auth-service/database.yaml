# Auth Service Database Configuration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-db-config
  namespace: microservices
data:
  DATABASE_URL: "postgresql://admin:connectify123@postgres-service:5432/auth_service"
  DB_SCHEMA: "auth"

---
# Auth Service Database Migration Job
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-migration
  namespace: microservices
spec:
  template:
    spec:
      containers:
      - name: migration
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          export PGPASSWORD=$DB_PASSWORD
          # Create database if it doesn't exist
          psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'auth_service'" | grep -q 1 || psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d postgres -c "CREATE DATABASE auth_service;"
          # Connect to the database and create schema and tables
          psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d auth_service -c "
          CREATE SCHEMA IF NOT EXISTS auth;
          
          -- Users table
          CREATE TABLE IF NOT EXISTS auth.users (
            id SERIAL PRIMARY KEY,
            username VARCHAR(255) UNIQUE NOT NULL,
            email VARCHAR(255) UNIQUE NOT NULL,
            password_hash VARCHAR(255) NOT NULL,
            first_name VARCHAR(255),
            last_name VARCHAR(255),
            is_verified BOOLEAN DEFAULT FALSE,
            verification_code VARCHAR(6),
            refresh_token TEXT,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          -- User sessions table
          CREATE TABLE IF NOT EXISTS auth.user_sessions (
            id SERIAL PRIMARY KEY,
            user_id INTEGER REFERENCES auth.users(id) ON DELETE CASCADE,
            session_token VARCHAR(255) UNIQUE NOT NULL,
            expires_at TIMESTAMP NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          -- Password reset tokens
          CREATE TABLE IF NOT EXISTS auth.password_reset_tokens (
            id SERIAL PRIMARY KEY,
            user_id INTEGER REFERENCES auth.users(id) ON DELETE CASCADE,
            token VARCHAR(255) UNIQUE NOT NULL,
            expires_at TIMESTAMP NOT NULL,
            used BOOLEAN DEFAULT FALSE,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          "
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PASSWORD
      restartPolicy: OnFailure
