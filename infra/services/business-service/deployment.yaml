apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-service
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: business-service
  template:
    metadata:
      labels:
        app: business-service
    spec:
      containers:
      - name: business-service
        image: connectify/business
        ports:
        - containerPort: 3000
        env:
        - name: SERVER_NAME
          value: "business-service"
        - name: KAFKA_CLIENT_ID
          value: "business-service"
        # Service Configuration from Secrets
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: service-config
              key: PORT
        - name: NODE_ENV
          valueFrom:
            secretKeyRef:
              name: service-config
              key: NODE_ENV
        # Kafka Configuration from Secrets
        - name: KAFKA_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: kafka-credentials
              key: KAFKA_BROKER_URL
        # SMTP Configuration from Secrets
        - name: SMPT_HOST
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMPT_HOST
        - name: SMPT_PORT
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMPT_PORT
        - name: SMPT_SERVICE
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMPT_SERVICE
        - name: SMPT_MAIL
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMPT_MAIL
        - name: SMPT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMPT_PASSWORD
        # Database Configuration from Secrets
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PASSWORD
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: MONGODB_URI
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: BUSINESS_DB_URL
        envFrom:
        # Service Configuration from Secrets
        - secretRef:
            name: service-config
        # Auth Configuration from Secrets
        - secretRef:
            name: auth-credentials
        # AWS S3 Configuration from Secrets
        - secretRef:
            name: aws-s3-credentials
        # Kafka Configuration from Secrets
        - secretRef:
            name: kafka-credentials
        # resources:
        #   requests:
        #     memory: "128Mi"
        #     cpu: "100m"
        #   limits:
        #     memory: "256Mi"
        #     cpu: "200m"