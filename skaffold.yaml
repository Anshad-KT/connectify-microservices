apiVersion: skaffold/v2alpha3
kind: Config
metadata:
  name: connectify
build:
  local:
    push: false
  artifacts:
    - image: connectify/auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: "/user/src"
    - image: connectify/business
      context: business
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: "/user/src"
    - image: connectify/project
      context: project
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: "/user/src"
deploy:
  kubectl:
    manifests:
      - infra/base/namespace.yaml   # ensure namespace created first
      - infra/secrets.yaml          # create secrets first
      - infra/kafka.yaml            # deploy Kafka (Zookeeper + broker)
      - infra/postgresql.yaml       # deploy PostgreSQL database
      - infra/services/**/*         # deploy all service configurations including database migrations
      - infra/base/ingress.yaml     # configure NGINX ingress routes